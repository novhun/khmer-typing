<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="pixelShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer pixel border -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#334155" stroke-width="8"/>
  
  <!-- Arcade Question / Keyboard Block -->
  <g filter="url(#pixelShadow)">
    <!-- Block base -->
    <rect x="96" y="96" width="320" height="320" rx="36" fill="url(#goldGrad)" stroke="#78350f" stroke-width="12"/>
    <!-- Inner highlights -->
    <rect x="114" y="114" width="284" height="16" fill="#fef08a" opacity="0.8"/>
    <rect x="114" y="114" width="16" height="284" fill="#fef08a" opacity="0.8"/>
    <!-- Block corner rivets -->
    <rect x="120" y="120" width="16" height="16" fill="#78350f"/>
    <rect x="376" y="120" width="16" height="16" fill="#78350f"/>
    <rect x="120" y="376" width="16" height="16" fill="#78350f"/>
    <rect x="376" y="376" width="16" height="16" fill="#78350f"/>
    
    <!-- Retro Pixel '?' and 'ក' combo symbol -->
    <!-- Pixel question mark / key symbol -->
    <!-- Top bar of ? -->
    <rect x="200" y="160" width="112" height="28" fill="#713f12"/>
    <!-- Right stem of ? -->
    <rect x="284" y="188" width="28" height="56" fill="#713f12"/>
    <!-- Middle bar of ? -->
    <rect x="228" y="244" width="84" height="28" fill="#713f12"/>
    <!-- Lower stem of ? -->
    <rect x="228" y="272" width="28" height="32" fill="#713f12"/>
    <!-- Dot of ? -->
    <rect x="228" y="324" width="28" height="28" fill="#713f12"/>
  </g>

  <!-- Small retro pixel keyboard bar at bottom -->
  <g opacity="0.9">
    <rect x="128" y="440" width="40" height="20" rx="4" fill="#38bdf8"/>
    <rect x="176" y="440" width="40" height="20" rx="4" fill="#fbbf24"/>
    <rect x="224" y="440" width="64" height="20" rx="4" fill="#4ade80"/>
    <rect x="296" y="440" width="40" height="20" rx="4" fill="#f472b6"/>
    <rect x="344" y="440" width="40" height="20" rx="4" fill="#a78bfa"/>
  </g>
</svg>
